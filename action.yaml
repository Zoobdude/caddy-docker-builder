name: 'Custom Caddy Docker builder'
description: 'Build a Caddy docker container'
author: 'Luke Thomas'
branding:
  icon: 'package'
  color: 'green'

inputs:
  modules:
    description: |
      A list of links to caddy modules (typically GitHub repo links).
      Use the | to provide a seperate link on each line
    required: true

  docker-username:
    description: "Username used to log against the Docker registry"
    required: true

  docker-password:
    description: "Password or personal access token used to log against the Docker registry"
    required: true

  image:
    description: "Image to push"
    required: true
  
  platforms:
    description: "List of target platforms for build"
    required: true

  dockerfile:
    description: "Path to a custom Dockerfile"
    required: false

runs:
  using: "composite"
  steps: 
    - name: Output modules
      run: echo $INPUT_MODULES
      shell: bash
      env:
        INPUT_MODULES: ${{ inputs.modules }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get Caddy base version
      id: get_base_version
      run: |
        base_version=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' caddy:latest)
        echo "base_version=${base_version#v}" >> $GITHUB_ENV

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ inputs.image }}:${{ env.base_version }}
        context: .
        file: ${{ inputs.dockerfile || github.action_path + '/Dockerfile' }}
        build-args: |
          "MODULES=${{ inputs.modules }}"
        platforms: ${{ inputs.platforms }}
