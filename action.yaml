name: 'Custom Caddy Docker builder'
description: 'Build a Caddy docker container'
author: 'Luke Thomas'

inputs:
  modules:
    description: |
      A list of links to caddy modules (typically GitHub repo links).
      Must be comma seperated
    required: true

  docker-username:
    description: "Username used to log against the Docker registry"
    required: true

  docker-password:
    description: "Password or personal access token used to log against the Docker registry"
    required: true

  tags:
    description: "List of tags"
    required: true

runs:
  using: "composite"
  steps: 
    - name: Output modules
      run: echo $INPUT_MODULES
      shell: bash
      env:
        INPUT_MODULES: ${{ inputs.modules }}

    - name: Pull Dockerfile
      run: wget https://raw.githubusercontent.com/Zoobdude/caddy-docker-builder/refs/heads/main/Dockerfile
      shell: bash

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ inputs.tags }}
        context: .